name: Build & Push Docker Images

on:
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # ---------- Backend services ----------

      - name: Build and push Data Ingestor
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/meters-app-data-ingestor
          TAG=${{ github.sha }}
          docker build \
            -t $IMAGE_NAME:$TAG \
            -f Backend/Services/DataIngestorService/DataIngestor.Api/Dockerfile \
            Backend
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      - name: Copy docker compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: |
            docker-compose.yml
            docker-compose.deploy.yml
          target: /opt/meters-app

      - name: Deploy on server with docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            cd /opt/meters-app

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export ASPNETCORE_ENVIRONMENT=Production
            export ASPNETCORE_URLS=http://0.0.0.0:8080

            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d

            docker image prune -f
