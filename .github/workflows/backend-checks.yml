name: Backend check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build Backend/Services/MetersApp.sln
    - name: Test
      run: dotnet test Backend/Services/MetersApp.sln --no-build
