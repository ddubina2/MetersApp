services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: masstransit/rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    ports:
    - "5672:5672"
    - "15672:15672"

  weakappapi:
    build:
      context: ./Backend/WeakApp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
    ports:
      - "8081:8080"

  dataingestor:
    build:
      context: ./Backend
      dockerfile: Services/DataIngestorService/DataIngestor.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
      WeakAppOptions__BaseUrl: ${WEAKAPP_BASE_URL}
      WeakAppOptions__ApiKey: ${WEAKAPP_API_KEY}
      WeakAppOptions__RequestIntervalSec: ${WEAKAPP_REQUEST_INTERVAL}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
    ports:
      - "8082:8080"

  dataprocessor:
    build:
      context: ./Backend
      dockerfile: Services/DataProcessorService/DataProcessor.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
    ports:
      - "8083:8080"

  graphqlgateway:
    build:
      context: ./Backend
      dockerfile: Services/GraphQLGatewayService/GraphQLGateway.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CorsOptions__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - postgres
    networks:
      - backend
      - frontend
    ports:
      - "8084:8080"

  notifications:
    build:
      context: ./Backend
      dockerfile: Services/NotificationsService/Notifications.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
      CorsOptions__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
      - frontend
    ports:
      - "8085:8080"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SENSORS_HUB_URL: ${VITE_SENSORS_HUB_URL}
    restart: unless-stopped
    networks:
      - frontend
    ports:
    - "3000:80"

networks:
  backend:
    internal: true
  frontend:
    internal: false

volumes:
  postgres_data:
  rabbitmq_data:
