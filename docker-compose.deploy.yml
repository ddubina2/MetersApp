name: metersapp

services:
  rabbitmq:
    image: masstransit/rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  weakapp-api:
    image: regen31/weakapp:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - rabbitmq
    networks:
      - backend

  data-ingestor:
    image: ghcr.io/ddubina2/meters-app-data-ingestor:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
      WeakAppOptions__BaseUrl: ${WEAKAPP_BASE_URL}
      WeakAppOptions__ApiKey: ${WEAKAPP_API_KEY}
      WeakAppOptions__RequestIntervalSec: ${WEAKAPP_REQUEST_INTERVAL}
    depends_on:
      - rabbitmq
    networks:
      - backend

  data-cleaner:
    image: ghcr.io/ddubina2/meters-app-data-cleaner:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DataCleanerOptions__RunIntervalMinutes: ${DATA_CLEANER_RUN_INTERVAL_MINUTES}
      DataCleanerOptions__RetentionDays: ${DATA_CLEANER_RETENTION_DAYS}
    networks:
      - backend

  data-processor:
    image: ghcr.io/ddubina2/meters-app-data-processor:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8083
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
      DbMigrationsOptions__RunOnStartup: ${MIGRATE_DB_ON_STARTUP}
      DbMigrationsOptions__MaxRetries: ${MIGRATION_MAX_RETRIES}
    depends_on:
      - rabbitmq
    networks:
      - backend

  graphql-gateway:
    image: ghcr.io/ddubina2/meters-app-graph-ql-gateway:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8084
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CorsOptions__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS}
    networks:
      - backend
      - frontend
    ports:
      - "8084:8084"

  notifications:
    image: ghcr.io/ddubina2/meters-app-notifications:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8085
      RabbitMqOptions__Host: ${RABBITMQ_HOST}
      RabbitMqOptions__UserName: ${RABBITMQ_USER}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
      CorsOptions__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - rabbitmq
    networks:
      - backend
      - frontend
    ports:
      - "8085:8085"

  frontend:
    image: ghcr.io/ddubina2/meters-app-frontend:latest
    restart: unless-stopped
    depends_on:
      - graphql-gateway
      - notifications
    networks:
      - frontend
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - backend
      - frontend
    depends_on:
      - data-ingestor
      - data-cleaner
      - data-processor
      - graphql-gateway
      - notifications

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "5000:3000"
    networks:
      - backend
      - frontend
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  backend:
    internal: true
  frontend:
    internal: false

volumes:
  rabbitmq_data:
  grafana-data:
